<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>"
    />

    <!-- Primary Title & Standard Meta Tags -->
    <title>Anamika & Sumit | Wedding Invitation</title>
    <meta
      name="description"
      content="Join us in celebrating the wedding of Anamika & Sumit. Tap to open the invitation!"
    />

    <!-- WhatsApp & Open Graph Preview Tags -->
    <meta property="og:site_name" content="Anamika & Sumit Wedding" />
    <meta property="og:type" content="website" />
    <!-- Replace with your actual live deployed domain -->
    <meta property="og:url" content="https://anamika-weds-sumit.vercel.app/" />
    <meta
      property="og:title"
      content="Anamika & Sumit are Getting Married! 💍✨"
    />
    <meta
      property="og:description"
      content="Join us as we celebrate our wedding day. Tap the link to open the invitation!"
    />

    <!-- WhatsApp Image Tags (Targeting /assets/whatsapp-preview.PNG) -->
    <meta
      property="og:image"
      content="https://anamika-weds-sumit.vercel.app/assets/whatsapp-preview.PNG"
    />
    <meta
      property="og:image:secure_url"
      content="https://anamika-weds-sumit.vercel.app/assets/whatsapp-preview.PNG"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / Telegram Card Fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Anamika & Sumit are Getting Married! 💍✨"
    />
    <meta
      name="twitter:description"
      content="Join us as we celebrate our wedding day. Tap to open the invitation!"
    />
    <meta
      name="twitter:image"
      content="https://anamika-weds-sumit.vercel.app/assets/whatsapp-preview.PNG"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
